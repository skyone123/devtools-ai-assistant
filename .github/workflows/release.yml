name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Stamp version into manifest.json
        run: |
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          node build.mjs

      - name: Package extension
        run: |
          mv dist "devtools-ai-assistant-$VERSION"
          zip -r "devtools-ai-assistant-$VERSION.zip" "devtools-ai-assistant-$VERSION"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DevTools AI Assistant v${{ env.VERSION }}
          files: devtools-ai-assistant-${{ env.VERSION }}.zip
          generate_release_notes: true

      - name: Upload artifact (manual run without tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: devtools-ai-assistant-${{ env.VERSION }}
          path: devtools-ai-assistant-${{ env.VERSION }}.zip
