<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      background: #2d2d2d;
      border: 1px solid #404040;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      transition: all 0.15s;
    }
    button:hover {
      background: #363636;
      border-color: #4a9eff;
      color: #4a9eff;
    }
  </style>
</head>
<body>
  <button data-q="Analyze all failed network requests (4xx/5xx) on this page, explain the root causes, and suggest fixes.">Analyze failed network requests</button>
  <button data-q="Explain each console error and warning on this page, and suggest fixes.">Explain console errors</button>
  <button data-q="Analyze the layout and styles of the currently selected element, and point out potential issues.">Analyze selected element</button>
  <script src="sidebar.js"></script>
</body>
</html>
