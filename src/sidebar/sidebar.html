<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      background: #2d2d2d;
      border: 1px solid #404040;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      transition: all 0.15s;
    }
    button:hover {
      background: #363636;
      border-color: #4a9eff;
      color: #4a9eff;
    }
  </style>
</head>
<body>
  <button data-q="分析当前页面所有失败的网络请求（4xx/5xx），解释根因并给出修复建议">分析失败的网络请求</button>
  <button data-q="逐条解释当前控制台错误信息，并给出修复建议">解释控制台错误</button>
  <button data-q="分析 Elements 面板当前选中元素的布局和样式，指出潜在问题">分析选中元素布局</button>
  <script src="sidebar.js"></script>
</body>
</html>
