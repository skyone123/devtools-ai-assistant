<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <div id="context-bar">
      <label class="ctx-toggle">
        <input type="checkbox" id="ctx-network" checked>
        <span class="ctx-label">Network</span>
        <span class="ctx-count" id="ctx-network-count">0</span>
      </label>
      <label class="ctx-toggle">
        <input type="checkbox" id="ctx-console" checked>
        <span class="ctx-label">Console</span>
        <span class="ctx-count" id="ctx-console-count">0</span>
      </label>
      <label class="ctx-toggle">
        <input type="checkbox" id="ctx-dom" checked>
        <span class="ctx-label">DOM/CSS</span>
      </label>
      <div class="spacer"></div>
      <button id="reinject-console" title="Reload the page with console capture injected before any page script runs, so early errors are not missed">捕获早期日志</button>
      <button id="clear-chat" title="Clear conversation">Clear</button>
    </div>

    <div id="token-bar" hidden>
      <span class="token-label">SHIELD</span>
      <span id="token-info">—</span>
      <button id="token-copy">Copy</button>
    </div>

    <div id="tools-bar">
      <span class="tools-title">🔧 分析工具</span>
      <button class="tool" data-tool="diff" title="同一接口两次调用的响应字段级差异">响应 Diff</button>
      <button class="tool" data-tool="sensitive" title="扫描响应体中的密钥 / 内网 IP / PII">敏感扫描</button>
      <button class="tool" data-tool="auth" title="哪些接口未带 Authorization">认证审计</button>
      <button class="tool" data-tool="headers" title="CSP / HSTS / XFO 缺失检测">响应头检查</button>
      <button class="tool" data-tool="surface" title="从 URL 推断参数与测试点（仅授权测试）">攻击面枚举</button>
      <button class="tool" data-tool="waterfall" title="HAR 时序分析：慢请求 / 串行阻塞">性能瀑布</button>
      <button class="tool" data-tool="mock" title="基于真实响应生成测试变体数据">Mock 生成</button>
    </div>

    <div id="conversation">
      <div class="welcome-message">
        <p>Ask AI about network requests, console errors, or CSS issues on this page.</p>
        <p class="hint">Configure your model in the extension options page.</p>
      </div>
    </div>

    <div id="templates">
      <button class="tpl" data-q="分析当前页面所有失败的网络请求（4xx/5xx），解释根因并给出修复建议">分析失败请求</button>
      <button class="tpl" data-q="逐条解释当前控制台错误信息，并给出修复建议">解释控制台错误</button>
      <button class="tpl" data-q="分析 Elements 面板当前选中元素的布局和样式，指出潜在问题">分析选中元素</button>
      <button class="tpl" data-q="汇总当前页面调用的所有 API 接口，按功能分组说明">汇总 API 清单</button>
    </div>

    <div id="input-bar">
      <textarea id="input" placeholder="Ask about errors, requests, styling issues..." rows="2"></textarea>
      <button id="stop" hidden>Stop</button>
      <button id="send" disabled>Send</button>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
