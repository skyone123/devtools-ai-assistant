<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #1e1e1e;
      color: #e0e0e0;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 {
      margin-bottom: 24px;
      color: #4a9eff;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: #2d2d2d;
      border: 1px solid #404040;
      color: #e0e0e0;
      border-radius: 4px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
      border-color: #4a9eff;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .row .field {
      flex: 1;
    }
    .hint {
      font-size: 12px;
      color: #808080;
      margin-top: 4px;
    }
    button {
      background: #4a9eff;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover {
      background: #6bb0ff;
    }
    #status {
      display: inline-block;
      margin-left: 12px;
      color: #4a9eff;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>AI Model Configuration</h2>

  <div class="field">
    <label for="apiEndpoint">API Endpoint</label>
    <input type="text" id="apiEndpoint" placeholder="http://localhost:11434/v1/chat/completions">
    <div class="hint">Any OpenAI-compatible endpoint (OpenAI, Ollama, vLLM, LM Studio, etc.)</div>
  </div>

  <div class="field">
    <label for="apiKey">API Key (optional)</label>
    <input type="password" id="apiKey" placeholder="sk-... (leave empty for local models)">
  </div>

  <div class="row">
    <div class="field">
      <label for="modelName">Model Name</label>
      <input type="text" id="modelName" placeholder="gpt-4o / llama3 / qwen2.5">
    </div>
    <div class="field">
      <label for="temperature">Temperature: <span id="temp-val">0.7</span></label>
      <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" style="width:100%">
    </div>
  </div>

  <div class="field">
    <label for="systemPrompt">System Prompt (optional)</label>
    <textarea id="systemPrompt" placeholder="Custom instructions for the AI assistant..."></textarea>
  </div>

  <button id="save">Save</button>
  <button id="test" style="background:#2d2d2d;border:1px solid #404040;margin-left:8px;">Test Connection</button>
  <span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
